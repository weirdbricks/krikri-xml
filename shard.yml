name: krikri-xml
version: 1.0.0

description: |
  Clean-room XML 1.0 (Fifth Edition) parser and XPath 1.0 evaluator in pure
  Crystal. No C dependencies - implemented directly from the W3C specification.

authors:
  - Krikri Contributors

crystal: ">= 1.10.0"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.7.0"
  minitest:
    github: weirdbricks/minitest.cr
    tag: v1.8.0-weirdbricks.1
  xml:
    github: ysbaddaden/xml.cr
