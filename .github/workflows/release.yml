name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify tag matches shard version
        shell: bash
        run: |
          version=$(awk '/^version:/ { print $2; exit }' shard.yml)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
